<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>单词助手</title>
    <style>
        /* 核心适配 */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; overflow-x: hidden; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, sans-serif; 
            background-color: #f5f5f5; 
            color: #333;
            -webkit-user-select: none; 
            user-select: none; 
            padding: 10px 10px 40px 10px; 
        }

        /* 深色模式适配 */
        @media (prefers-color-scheme: dark) {
            body { background-color: #121212; color: #e0e0e0; }
            .word-list { background-color: #1e1e1e !important; box-shadow: 0 2px 8px rgba(0,0,0,0.3) !important; }
            .word { color: #ffffff !important; }
            .meaning, .example-meaning { background-color: #2c2c2c !important; color: #bbb !important; border-left-color: #3498db !important; }
            .word-item { border-bottom-color: #333 !important; }
            .search-bar input { background-color: #2c2c2c; border-color: #444; color: white; }
            .btn-small { background-color: #1e1e1e; border-color: #3498db; color: #3498db; }
            .top-nav { background: rgba(30, 30, 30, 0.95) !important; border: 1px solid #333; }
            .review-option { background-color: #2c2c2c !important; border-color: #444 !important; color: #ddd !important; }
            .example-item { color: #aaa !important; }
        }

        /* 引导界面 */
        #importGuide { 
            background: white; border-radius: 15px; padding: 40px 20px; 
            text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin: 50px 10px; display: none;
        }
        .guide-btn { 
            display: block; width: 100%; padding: 16px; margin: 20px 0;
            background: #27ae60; color: white; border: none; border-radius: 12px;
            font-size: 16px; font-weight: bold; box-shadow: 0 4px 10px rgba(39,174,96,0.3);
        }

        /* 导航 & 控制区 */
        .top-nav {
            background: white; padding: 12px 10px; margin-bottom: 15px;
            border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .pagination { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 360px; }
        .pagination button { 
            padding: 10px 15px; background-color: #3498db; color: white; 
            border: none; border-radius: 8px; font-weight: bold; flex: 1; margin: 0 5px;
        }
        .pagination button:disabled { background-color: #eee; color: #bbb; }
        .jump-box { font-size: 12px; color: #888; display: flex; align-items: center; flex-wrap: wrap; justify-content: center; gap: 8px; }
        .jump-box input { width: 45px; padding: 5px; border: 1px solid #ddd; border-radius: 6px; text-align: center; font-size: 14px; }
        .go-btn { background: #3498db; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 12px; }
        
        .top-btns { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
        .btn-small { 
            flex: 1; padding: 10px 2px; border-radius: 20px; border: 1px solid #3498db; 
            background: white; color: #3498db; font-size: 13px; text-align: center; font-weight: bold;
        }
        .clear-marks-btn { color: #e67e22; border-color: #e67e22; }

        .search-bar { margin-bottom: 12px; display: flex; gap: 6px; width: 100%; }
        .search-bar input { 
            flex: 1; min-width: 0; padding: 10px; border: 1px solid #ddd; 
            border-radius: 8px; font-size: 15px; outline: none; 
        }
        .search-bar button { 
            padding: 0 15px; background-color: #3498db; color: white; 
            border: none; border-radius: 8px; font-weight: bold; flex-shrink: 0;
        }

        /* 单词列表 */
        .word-list { background-color: white; border-radius: 12px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .word-item { padding: 15px 0; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: flex-start; }
        .word-item:last-child { border-bottom: none; }
        .word-content { flex: 1; min-width: 0; }
        .word { font-weight: bold; font-size: 1.1rem; color: #2c3e50; word-wrap: break-word; display: block; }
        .meaning { 
            margin-top: 8px; color: #444; display: none; background-color: #f9fbff; 
            padding: 10px; border-left: 4px solid #3498db; border-radius: 4px; font-size: 0.95rem; 
        }

        /* 例句样式 */
        .example-item { margin: 8px 0 8px 12px; color: #34495e; font-size: 0.9rem; cursor: pointer; }
        .example-sentence { line-height: 1.4; }
        .example-meaning { 
            display: none; background-color: #f5f5f5; padding: 6px 10px; 
            border-left: 3px solid #95a5a6; border-radius: 4px; margin-top: 4px; color: #555; 
        }

        .sheet-title-container { display: flex; justify-content: center; padding: 12px 0; border-bottom: 2px solid #3498db; margin-bottom: 10px; width: 100%; }
        .sheet-title { font-weight: bold; color: #2980b9; font-size: 1.1rem; }

        .mark-checkbox { width: 26px; height: 26px; border: 2px solid #3498db; border-radius: 6px; appearance: none; -webkit-appearance: none; margin-left: 8px; flex-shrink: 0; position: relative; margin-top: 2px; }
        .mark-checkbox:checked { background-color: #3498db; }
        .mark-checkbox:checked::after { content: "✓"; position: absolute; color: white; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: bold; font-size: 16px; }

        /* 复习模式 */
        .review-option {
            display: flex; align-items: center; padding: 14px; margin-bottom: 12px;
            border: 2px solid #e0e0e0; border-radius: 10px; background-color: white;
            cursor: pointer; font-size: 16px; color: #34495e; transition: all 0.2s;
        }
        .review-mark { display: inline-block; width: 24px; text-align: center; font-weight: bold; margin-right: 10px; }
        .review-option.opt-correct { background-color: #d5f5e3; border-color: #27ae60; color: #1e8449; }
        .review-option.opt-wrong { background-color: #fadbd8; border-color: #e74c3c; color: #c0392b; }
    </style>
</head>
<body>
    <div id="mainContent" style="display:none">
        <div id="dynamicTitle" class="sheet-title-container"></div>

        <!-- 统一顶部导航栏 -->
        <div id="navContainer" class="top-nav">
            <div class="pagination">
                <button onclick="prevPage()">上一页</button>
                <span id="pageIndicator">1 / 1</span>
                <button onclick="nextPage()">下一页</button>
            </div>
            <div class="jump-box">
                跳至 <input type="number" id="jumpInput" min="1" onkeyup="if(event.keyCode==13)jumpToPage()"> 页 
                <button class="go-btn" onclick="jumpToPage()">跳转</button>
                <button class="go-btn" id="btnStudy" onclick="switchMode('study')">去学习</button>
                <button class="go-btn" id="btnReview" onclick="switchMode('review')">去复习</button>
                <button class="go-btn" id="btnSentence" onclick="switchMode('sentence')">例句</button>
            </div>
        </div>

        <!-- 学习 & 例句模式控制区 -->
        <div id="modeControls">
            <div class="top-btns">
                <button id="toggleAll" class="btn-small">展开全部</button>
                <button onclick="clearCurrentPageMarks()" class="btn-small clear-marks-btn">清除本页标记</button>
            </div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="搜索单词、中文或例句...">
                <button onclick="searchWords()">搜索</button>
            </div>
        </div>

        <div id="wordListContainer"></div>
    </div>

    <div id="importGuide">
        <h2 style="color:#333">未检测到单词库</h2>
        <p style="color:#666">请导入 JSON 单词表以开始学习</p>
        <button class="guide-btn" onclick="AndroidBridge.requestExternalImport()">导入 JSON 单词表</button>
    </div>

    <script>
let sheetNames = []; 
let currentSheetIndex = 0;
let currentMode = 'study'; // 'study', 'review', 'sentence'
let markedWords = new Set(JSON.parse(localStorage.getItem('markedWords') || '[]'));

let reviewOrder = [], reviewIndex = 0, reviewAnswers = {}, reviewLocked = false, allMeanings = [];

function initFromAndroid() {
    if (typeof AndroidBridge !== "undefined") {
        if (!AndroidBridge.hasData()) {
            document.getElementById('importGuide').style.display = 'block';
            document.getElementById('mainContent').style.display = 'none';
            return;
        }
        document.getElementById('importGuide').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';

        sheetNames = JSON.parse(AndroidBridge.getListNames());
        allMeanings = [];
        sheetNames.forEach(name => {
            JSON.parse(AndroidBridge.getWordsByListName(name)).forEach(w => allMeanings.push(w.meaning));
        });

        const lastList = AndroidBridge.getLastListName();
        currentSheetIndex = sheetNames.indexOf(lastList);
        if (currentSheetIndex === -1) currentSheetIndex = 0;
        
        refreshView();
    }
}

function switchMode(mode) {
    currentMode = mode;
    refreshView();
    window.scrollTo(0,0);
}

function refreshView() {
    // 更新按钮显示
    document.getElementById('btnStudy').style.display = currentMode === 'study' ? 'none' : 'inline-block';
    document.getElementById('btnReview').style.display = currentMode === 'review' ? 'none' : 'inline-block';
    document.getElementById('btnSentence').style.display = currentMode === 'sentence' ? 'none' : 'inline-block';
    
    document.getElementById('modeControls').style.display = currentMode === 'review' ? 'none' : 'block';

    if (currentMode === 'review') {
        startReview(currentSheetIndex);
    } else {
        loadWords(currentSheetIndex);
    }
    updateUI();
}

function loadWords(idx) {
    currentSheetIndex = idx;
    const listName = sheetNames[idx];
    const words = JSON.parse(AndroidBridge.getWordsByListName(listName));
    AndroidBridge.saveCurrentList(listName);

    document.getElementById('dynamicTitle').innerHTML = `<div class="sheet-title">${listName} (${words.length} 词) ${currentMode === 'sentence' ? ' - 例句模式' : ''}</div>`;

    const container = document.getElementById('wordListContainer');
    container.innerHTML = '';
    const listDiv = document.createElement('div');
    listDiv.className = 'word-list';
    words.forEach((item, i) => listDiv.appendChild(createWordRow(item, i + 1)));
    container.appendChild(listDiv);
    
    document.getElementById('toggleAll').textContent = "展开全部";
    updateUI();
}

function createWordRow(item, displayIdx) {
    const row = document.createElement('div');
    row.className = 'word-item';
    
    let examplesHtml = '';
    if (currentMode === 'sentence' && item.examples) {
        // 兼容对象和数组格式的例句
        const exList = Array.isArray(item.examples) ? item.examples : Object.values(item.examples);
        exList.forEach((ex, i) => {
            examplesHtml += `
                <div class="example-item" onclick="event.stopPropagation(); toggleEl(this.querySelector('.example-meaning'))">
                    <div class="example-sentence">ex${i+1}. ${ex.sentence}</div>
                    <div class="example-meaning">${ex.emeaning || '暂无翻译'}</div>
                </div>`;
        });
    }

    row.innerHTML = `
        <div class="word-content" onclick="toggleEl(this.querySelector('.meaning'))">
            <span class="word">${displayIdx}. ${item.word}</span>
            <div class="meaning">${item.meaning}</div>
            ${examplesHtml}
        </div>
        <input type="checkbox" class="mark-checkbox" data-word="${item.word}" ${markedWords.has(item.word)?'checked':''} onclick="event.stopPropagation()">
    `;

    row.querySelector('.mark-checkbox').onchange = (e) => {
        if(e.target.checked) markedWords.add(item.word);
        else markedWords.delete(item.word);
        localStorage.setItem('markedWords', JSON.stringify(Array.from(markedWords)));
    };
    return row;
}

function toggleEl(el) {
    if (el) el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

// --- 复习模式 ---
function startReview(idx) {
    currentSheetIndex = idx;
    const listName = sheetNames[idx];
    const words = JSON.parse(AndroidBridge.getWordsByListName(listName));
    reviewOrder = shuffleArr(words.slice());
    reviewIndex = 0; reviewAnswers = {}; reviewLocked = false;
    document.getElementById('dynamicTitle').innerHTML = `<div class="sheet-title">${listName} 复习模式</div>`;
    renderReviewQuestion();
    updateUI();
}

function renderReviewQuestion() {
    const total = reviewOrder.length;
    const container = document.getElementById('wordListContainer');
    container.innerHTML = '';
    if (!total) return container.innerHTML = '<div class="word-list" style="text-align:center">无数据</div>';

    const q = reviewOrder[reviewIndex];
    const qNo = reviewIndex + 1;
    const pool = shuffleArr(allMeanings.slice());
    const distractors = [];
    for (let d = 0; d < pool.length && distractors.length < 3; d++) {
        if (pool[d] !== q.meaning && !distractors.includes(pool[d])) distractors.push(pool[d]);
    }
    const options = shuffleArr([q.meaning, ...distractors]);

    const card = document.createElement('div');
    card.className = 'word-list';
    card.innerHTML = `
        <div style="font-size:0.9rem; color:#888; text-align:right">题目: ${qNo}/${total}</div>
        <div style="font-size:1.6rem;font-weight:bold;color:#2c3e50;margin:15px 0 25px;text-align:center">${q.word}</div>
        <div id="reviewOptions"></div>
        <div style="display:flex;justify-content:center;gap:15px;margin-top:20px;">
            <button onclick="prevReviewQuestion()" class="btn-small" style="max-width:100px">上一题</button>
            <button onclick="nextReviewQuestion()" class="btn-small" style="max-width:100px">下一题</button>
        </div>
    `;
    container.appendChild(card);

    options.forEach((opt, i) => {
        const optDiv = document.createElement('div');
        optDiv.className = 'review-option';
        optDiv.innerHTML = `<span class="review-mark"></span><span>${opt}</span>`;
        optDiv.onclick = () => {
            if (reviewLocked) return;
            reviewLocked = true;
            const isCorrect = (opt === q.meaning);
            reviewAnswers[qNo] = { selected: opt, isCorrect: isCorrect };
            document.querySelectorAll('.review-option').forEach(o => {
                if(o.innerText.includes(q.meaning)) markOption(o, 'correct');
                else if(o === optDiv && !isCorrect) markOption(o, 'wrong');
            });
            if (isCorrect) setTimeout(() => { if (reviewIndex < total - 1) { reviewIndex++; renderReviewQuestion(); } }, 500);
        };
        document.getElementById('reviewOptions').appendChild(optDiv);
    });

    if (reviewAnswers[qNo]) {
        reviewLocked = true;
        const saved = reviewAnswers[qNo];
        document.querySelectorAll('.review-option').forEach(o => {
            if(o.innerText.includes(q.meaning)) markOption(o, 'correct');
            else if(o.innerText.includes(saved.selected) && !saved.isCorrect) markOption(o, 'wrong');
        });
    }
}

function prevReviewQuestion() { if (reviewIndex > 0) { reviewIndex--; renderReviewQuestion(); } }
function nextReviewQuestion() { if (reviewIndex < reviewOrder.length - 1) { reviewIndex++; renderReviewQuestion(); } }

function markOption(el, type) {
    el.classList.add(type === 'correct' ? 'opt-correct' : 'opt-wrong');
    el.querySelector('.review-mark').textContent = (type === 'correct') ? '✓' : '✗';
}

function shuffleArr(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// --- 通用 UI ---
function updateUI() {
    const pageText = `${currentSheetIndex + 1} / ${sheetNames.length}`;
    document.getElementById('pageIndicator').textContent = pageText;
    document.querySelectorAll('.pagination button').forEach((b, i) => {
        if(i===0) b.disabled = currentSheetIndex === 0;
        else b.disabled = currentSheetIndex === sheetNames.length - 1;
    });
    document.getElementById('jumpInput').value = currentSheetIndex + 1;
}

function prevPage() { if(currentSheetIndex > 0) { currentSheetIndex--; refreshView(); window.scrollTo(0,0); } }
function nextPage() { if(currentSheetIndex < sheetNames.length - 1) { currentSheetIndex++; refreshView(); window.scrollTo(0,0); } }
function jumpToPage() {
    const p = parseInt(document.getElementById('jumpInput').value);
    if(p >= 1 && p <= sheetNames.length) { currentSheetIndex = p - 1; refreshView(); window.scrollTo(0,0); }
}

function clearCurrentPageMarks() {
    if(confirm('确定要取消本页所有标记吗？')) {
        document.querySelectorAll('.mark-checkbox').forEach(cb => { markedWords.delete(cb.dataset.word); cb.checked = false; });
        localStorage.setItem('markedWords', JSON.stringify(Array.from(markedWords)));
    }
}

function searchWords() {
    const kw = document.getElementById('searchInput').value.trim().toLowerCase();
    if(!kw) { loadWords(currentSheetIndex); return; }
    document.getElementById('dynamicTitle').innerHTML = `<div class="sheet-title">搜索结果 (${currentMode === 'sentence' ? '例句模式' : '学习模式'})</div>`;
    const container = document.getElementById('wordListContainer');
    container.innerHTML = '';
    const listDiv = document.createElement('div');
    listDiv.className = 'word-list';
    let count = 1;
    sheetNames.forEach(listName => {
        JSON.parse(AndroidBridge.getWordsByListName(listName)).forEach(item => {
            let match = item.word.toLowerCase().includes(kw) || item.meaning.toLowerCase().includes(kw);
            if (!match && item.examples) {
                const exList = Array.isArray(item.examples) ? item.examples : Object.values(item.examples);
                match = exList.some(ex => ex.sentence.toLowerCase().includes(kw) || (ex.emeaning && ex.emeaning.toLowerCase().includes(kw)));
            }
            if(match) listDiv.appendChild(createWordRow(item, count++));
        });
    });
    container.appendChild(listDiv);
}

document.getElementById('toggleAll').onclick = (e) => {
    const ms = document.querySelectorAll('.meaning, .example-meaning');
    const anyHidden = Array.from(ms).some(m => m.style.display !== 'block');
    ms.forEach(m => m.style.display = anyHidden ? 'block' : 'none');
    e.target.textContent = anyHidden ? "折叠全部" : "展开全部";
};

if (typeof AndroidBridge !== "undefined") initFromAndroid();
else {
    window.AndroidBridge = {
        hasData: () => true,
        getListNames: () => JSON.stringify(["考研单词 (一)"]),
        getWordsByListName: () => JSON.stringify([{word:"abandon", meaning:"vt. 离弃", examples:[{sentence:"He abandoned his car.", emeaning:"他丢弃了他的车。"}]}]),
        getLastListName: () => "考研单词 (一)", saveCurrentList: () => {}
    };
    initFromAndroid();
}
    </script>
</body>
</html>
